name: Validate

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    name: Lint, check and validate the plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint the skills, commands and agents
        run: npm run lint

      - name: Check the generated files against the committed catalogues
        run: npm run check

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the marketplace and the plugin
        run: npm run validate
