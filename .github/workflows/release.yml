name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Publish the GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify the tag matches the plugin version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION=$(node -p "require('./plugins/subscriby/.claude-plugin/plugin.json').version")
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin.json version $PLUGIN_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint and check
        run: npm run lint && npm run check

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the marketplace and both plugins
        run: npm run validate

      - name: Extract the release notes from the changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { printing = 1; next }
            printing && /^## \[/ { exit }
            printing { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || echo "See CHANGELOG.md." > RELEASE_NOTES.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Subscriby Agentic Kit $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
